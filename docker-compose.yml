services:
  postgres:
    image: postgres:16-alpine
    container_name: ordermanagement-postgres
    environment:
      POSTGRES_DB: ordermanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordermanagement"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ordermanagement-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ordermanagement
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 0123456789012345678901234567890123456789012345678901234567890123
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
